# Valores sensiveis vem de variaveis de ambiente ou do arquivo
# application-local.properties (nao versionado). Veja application-local.properties.example.
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/transporte}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
openroute.api.key=${OPENROUTE_API_KEY:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=28800000
