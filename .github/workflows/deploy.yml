name: CI/CD - Deploy SIGTS no Coolify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-backend:
    name: CI - Build do Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transporte
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar o backend
        run: mvn -B package -DskipTests

  build-frontend:
    name: CI - Build do Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Compilar o frontend
        run: npm run build

  deploy:
    name: CD - Deploy no Coolify
    runs-on: ubuntu-latest
    needs: [ build-backend, build-frontend ]
    env:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Deploy do Backend
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_BACKEND }}
        run: |
          STATUS=$(curl -sL -o resposta.txt -w "%{http_code}" -X POST "$WEBHOOK" -H "Authorization: Bearer $COOLIFY_TOKEN")
          if [ "$STATUS" -ge 400 ]; then
            echo "POST retornou $STATUS, tentando GET..."
            STATUS=$(curl -sL -o resposta.txt -w "%{http_code}" -X GET "$WEBHOOK" -H "Authorization: Bearer $COOLIFY_TOKEN")
          fi
          echo "Resposta do Coolify (HTTP $STATUS):"
          cat resposta.txt; echo
          [ "$STATUS" -lt 400 ]

      - name: Deploy do Frontend
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_FRONTEND }}
        run: |
          STATUS=$(curl -sL -o resposta.txt -w "%{http_code}" -X POST "$WEBHOOK" -H "Authorization: Bearer $COOLIFY_TOKEN")
          if [ "$STATUS" -ge 400 ]; then
            echo "POST retornou $STATUS, tentando GET..."
            STATUS=$(curl -sL -o resposta.txt -w "%{http_code}" -X GET "$WEBHOOK" -H "Authorization: Bearer $COOLIFY_TOKEN")
          fi
          echo "Resposta do Coolify (HTTP $STATUS):"
          cat resposta.txt; echo
          [ "$STATUS" -lt 400 ]
