name: CI/CD - Deploy SIGTS no Coolify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-backend:
    name: CI - Build do Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transporte
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar o backend
        run: mvn -B package -DskipTests

  build-frontend:
    name: CI - Build do Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Compilar o frontend
        run: npm run build

  deploy:
    name: CD - Deploy no Coolify
    runs-on: ubuntu-latest
    needs: [ build-backend, build-frontend ]
    steps:
      - name: Deploy do Backend
        run: |
          curl --fail --request GET "${{ secrets.COOLIFY_WEBHOOK_BACKEND }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Deploy do Frontend
        run: |
          curl --fail --request GET "${{ secrets.COOLIFY_WEBHOOK_FRONTEND }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
